[package]
name = "graph-map-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Standalone CLI, stdio MCP server, and local Web UI for code graph maps"

[[bin]]
name = "graph-map"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
graph-map-core = { path = "../graph-map-core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order", "arbitrary_precision"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
