[package]
name = "graph-map-ui"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "Interactive dependency, AST/IR, and commit map WASM UI"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3.107"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"

[dependencies.web-sys]
version = "0.3.107"
features = [
  "Window","Document","Element","Node","NodeList","Event","EventTarget","EventSource","EventSourceInit","MessageEvent",
  "KeyboardEvent","MouseEvent","PointerEvent","FocusEvent","WheelEvent","AddEventListenerOptions",
  "HtmlElement","HtmlInputElement","HtmlSelectElement","HtmlTextAreaElement","HtmlFormElement",
  "HtmlDialogElement","HtmlDetailsElement","HtmlAnchorElement","HtmlCanvasElement","HtmlCollection",
  "CanvasRenderingContext2d","DomTokenList","CssStyleDeclaration","DomRect",
  "Request","RequestInit","RequestCredentials","RequestCache","RequestMode","Response",
  "Headers","AbortController","AbortSignal","Storage","Location","History","MediaQueryList",
  "File","FileList","FileReader","Blob","ProgressEvent","Navigator","Clipboard","Crypto","console"
]
