[package]
name = "graph-map-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "Interactive dependency map WASM UI"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3.107"
serde_json = "1.0.150"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"

[dependencies.web-sys]
version = "0.3.107"
features = [
  "Window","Document","Element","Node","NodeList","Event","EventTarget","KeyboardEvent",
  "MouseEvent","PointerEvent","HtmlElement","HtmlInputElement","HtmlSelectElement",
  "HtmlTextAreaElement","HtmlFormElement","HtmlDialogElement","HtmlDetailsElement","HtmlAnchorElement","HtmlCollection",
  "DomTokenList","CssStyleDeclaration","DomRect",
  "Request","RequestInit","RequestCredentials","RequestCache","RequestMode","Response",
  "Headers","AbortController","AbortSignal","Storage","Location","History","MediaQueryList",
  "File","Blob","Navigator","Clipboard","Crypto","console"
]
