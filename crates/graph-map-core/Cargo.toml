[package]
name = "graph-map-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Standalone dependency, commit, architecture, AST/IR, and run-coverage graph map engine"

[dependencies]
chrono = "=0.4.45"
libc = "=0.2.191"
notify = "8"
regex = "1"
rusqlite = { version = "=0.37.0", features = ["bundled", "modern_sqlite"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.150", features = ["preserve_order", "arbitrary_precision"] }
sha2 = "=0.11.0"
tokio = { version = "=1.54.1", features = ["rt", "sync"] }
toml = "0.8"
tree-sitter = "0.25"
tree-sitter-c-sharp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-php = "0.25"
tree-sitter-python = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-scala = "0.26"
tree-sitter-swift = "0.7"
tree-sitter-typescript = "0.23"
uuid = { version = "=1.22.0", features = ["v4"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "time"] }
