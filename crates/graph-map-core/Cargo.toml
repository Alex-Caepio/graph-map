[package]
name = "graph-map-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Standalone dependency, commit, architecture, and run-coverage graph map engine"

[dependencies]
chrono = "0.4.45"
libc = "0.2.191"
regex = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order", "arbitrary_precision"] }
sha2 = "0.11.0"
toml = "0.8.23"

[dev-dependencies]
tempfile = "3"
